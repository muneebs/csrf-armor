name: Release with Changesets

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@d648c2dd069001a242c621c8306af467f150e99d

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package first
        run: pnpm --filter @csrf-armor/core run build

      - name: Build all packages
        run: pnpm run build

      - name: Run type check
        run: pnpm run type-check

      - name: Run linting
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

  release:
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Mints the OIDC token npm and JSR authenticate with
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@d648c2dd069001a242c621c8306af467f150e99d

      # npm 11.5.1+ is required for OIDC trusted publishing; Node 24 ships it.
      # No registry-url: setup-node would write an ~/.npmrc pinning _authToken
      # to an unset NODE_AUTH_TOKEN, which only muddies the error if the OIDC
      # exchange fails. npm defaults to registry.npmjs.org anyway, and each
      # package sets publishConfig.registry.
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish to NPM
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: npm exchanges the workflow's OIDC id-token for a
          # short-lived, package-scoped publish token. Each package must name
          # this workflow file as its trusted publisher on npmjs.com.
          #
          # Trusted publishing enables provenance on its own, but only while
          # the setting is untouched (`config.isDefault('provenance')`) and the
          # visibility probe succeeds. Setting it explicitly makes attestation
          # unconditional rather than a side effect.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify npm provenance attestations
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          jq -r '.[] | "\(.name)@\(.version)"' <<<"$PUBLISHED_PACKAGES" \
            | xargs ./scripts/verify-provenance.sh

      # Publishes source (not dist) so JSR can generate docs and Node types.
      # Auth is OIDC via the id-token permission above; each package must be
      # linked to this repo in its jsr.io settings for that to be accepted.
      - name: Publish to JSR
        if: steps.changesets.outputs.published == 'true'
        run: ./scripts/publish-jsr.sh --allow-dirty

      - name: Create summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "Published packages:" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "- **\(.name)@\(.version)**"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "**NPM:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "npm install \(.name)@\(.version)"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**JSR:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          jq -r '"deno add jsr:\(.name)@\(.version)"' packages/*/jsr.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification
        if: steps.changesets.outputs.published == 'true' && vars.SLACK_WEBHOOK_URL
        run: |
          PACKAGES=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | tr '\n' ' ')
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"📦 New packages published: $PACKAGES\"}" \
            ${{ vars.SLACK_WEBHOOK_URL }}
